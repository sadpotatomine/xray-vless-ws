zerops:
  - setup: app
    build:
      base: alpine@3.23
      deployFiles:
        - entrypoint.sh
    run:
      base: alpine@3.23
      prepareCommands:
        - sudo apk update
        - sudo apk add --no-cache bash curl unzip
      ports:
        - port: 8080
          httpSupport: true
      envVariables:
        PORT: "8080"
      start: bash entrypoint.sh
